# Builds the site (apps/web) and deploys it to GitHub Pages.
#
# Path filtering is per job, not in `on:`, so the workflow always reports a
# status on a pull request: a workflow that never starts leaves a required
# check waiting forever.
name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Builds pull requests (any base branch, so stacked PRs are checked too)
  # without deploying them
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull request runs get their own per-PR group so they never queue behind or block a deployment,
# and a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Whether this event touched the site at all. The Worker (apps/ai-backend)
    # has its own workflow and does not need a site build.
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(.github/scripts/changed-files.sh)
          web=true
          if [ "$changed" != ALL ] && ! grep -qE '^(apps/web/|packages/content/|content/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/(workflows/deploy-web\.yaml|scripts/))' <<< "$changed"; then
              web=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_STEP_SUMMARY"

  # Build job
  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Job-level so the build and the tests see the same value: the dev-server
    # test compares `pnpm dev` HTML to the built dist/, so both must agree on
    # whether the chat island renders.
    env:
      # The chat widget's backend (apps/ai-backend), inlined into the
      # client bundle. Public by design; the Worker holds no secrets the
      # browser can reach. Without it the widget is not rendered, so the
      # deployed URL is the fallback until the repository variable is set.
      VITE_AI_API_URL: ${{ vars.AI_BACKEND_URL || 'https://rst0070-ai-backend.kwb0711.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Installs the pnpm version pinned by "packageManager" in the root package.json.
      # Must run before setup-node, whose pnpm cache calls `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      # No actions/configure-pages step: the site is a user site
      # (rst0070.github.io), so Vite's `base` stays "/". No build cache step
      # either: Vite keeps no cache between builds, and pnpm's store is cached
      # by setup-node.
      # Puppeteer downloads Chromium on install; cache it so only lockfile
      # changes pay the ~150MB download.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/pnpm-lock.yaml') }}
      # Only the site and what it depends on (@rst0070/content), so the build
      # does not install wrangler and workerd for apps/ai-backend, which is
      # checked by ai-backend.yaml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @rst0070/web...
      # puppeteer's postinstall (allowed in pnpm-workspace.yaml) normally
      # downloads Chrome during install. But pnpm's side-effects cache lives in
      # the store that setup-node restores, and a hit there can mark
      # puppeteer as already built and skip its postinstall, while
      # ~/.cache/puppeteer is a separate cache that can miss on its own. This
      # step is a no-op when Chrome is present and downloads it otherwise.
      - name: Ensure Chrome for Puppeteer
        # Run inside @rst0070/web: puppeteer is its dependency, and with pnpm's
        # isolated node_modules it is not resolvable from the workspace root.
        run: pnpm --filter @rst0070/web exec puppeteer browsers install chrome
      # The Korean portfolio PDF (dist/portfolio.ko.pdf) is printed by headless
      # Chrome, which draws tofu boxes for Hangul without a CJK font installed.
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # Also proves the pure `@rst0070/content` entry is Worker-safe: it is
      # checked without Node types, so any fs/path/process use fails here.
      - name: Typecheck @rst0070/content
        run: pnpm --filter @rst0070/content typecheck
      # The package's `build` script: `vite build`, then the prerender writes
      # every page into apps/web/dist, then apps/web/dist/portfolio.pdf is
      # rendered, which ships in the Pages artifact.
      - name: Build site
        run: pnpm --filter @rst0070/web build
      # After the build: the suite includes checks over the built apps/web/dist.
      - name: Test @rst0070/web
        run: pnpm --filter @rst0070/web test
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

  # Deployment job
  deploy:
    # Pull requests only build; deploy on push to main or manual dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
